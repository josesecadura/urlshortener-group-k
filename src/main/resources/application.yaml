server:
  forward-headers-strategy: framework

spring:
  application:
    name: urlshortener
  datasource:
    url: jdbc:hsqldb:mem:urlshortener
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true #reenvia eventos que no se han tratado, lo reenvia al reiniciar la aplicacion

urlshortener:
  analytics:
    processed-click-retention: 7d
    processed-click-prune-cron: "0 0 3 * * *"
  redirect-cache:
    provider: memory
    ttl: 5m

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,modulith

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

urlshortener:
  redirect-cache:
    provider: redis

---
spring:
  config:
    activate:
      on-profile: broker
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

urlshortener:
  redirect-cache:
    broker:
      exchange: links.cache-invalidation
      queue: links.cache-invalidation.queue
      routing-key: cache.invalidate
